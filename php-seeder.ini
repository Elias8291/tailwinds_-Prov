; PHP Configuration for Database Seeders
; This file increases memory limits for processing large datasets

; Increase memory limit to 1GB for large data processing
memory_limit = 1G

; Increase max execution time to 30 minutes
max_execution_time = 1800

; Increase input time limit
max_input_time = 1800

; Increase post max size
post_max_size = 1G

; Increase upload max filesize
upload_max_filesize = 1G

; Enable error reporting for debugging
display_errors = On
error_reporting = E_ALL

; Optimize for large data processing
realpath_cache_size = 4096K
realpath_cache_ttl = 600 
; Configuración PHP para desarrollo - Archivos grandes (50MB + buffer)
upload_max_filesize = 50M
post_max_size = 60M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
max_file_uploads = 20

; Configuraciones adicionales
file_uploads = On
allow_url_fopen = On
default_socket_timeout = 300

; Configuraciones adicionales para desarrollo
display_errors = On
error_reporting = E_ALL
log_errors = On 